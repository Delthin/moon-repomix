name: Publish and verify Mooncakes v0.5.1
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish once if absent, or verify an existing version without credentials
        type: choice
        options: [publish-and-verify, verify-only]
        default: publish-and-verify
permissions:
  contents: read
concurrency:
  group: mooncakes-publish-0.5.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Delthin/moon-repomix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOONBIT_INSTALL_VERSION: '0.10.17+d971670cd'
      RELEASE_VERSION: '0.5.1'
      RELEASE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize owned evidence paths
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/mooncakes-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$EVIDENCE"
          printf 'EVIDENCE=%s\nMOON_HOME=%s/.moon\n' "$EVIDENCE" "$HOME" >> "$GITHUB_ENV"
      - name: Install pinned official toolchain
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify compiler, source and target package
        shell: bash
        run: |
          moon version --all
          moon run --target native scripts/check-toolchain.mbtx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          grep -Fx 'name = "Delthin/moon_repomix"' moon.mod
          grep -Fx 'version = "0.5.1"' moon.mod
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE/source-revision.txt"
          moon update
          moon package --list > "$EVIDENCE/package-list.txt" 2>&1
          cp "_build/publish/Delthin-moon_repomix-$RELEASE_VERSION.zip" "$EVIDENCE/expected-source.zip"
      - name: Inspect public registry before any upload
        id: before
        shell: bash
        run: |
          git -C "$MOON_HOME/registry/index" show HEAD:user/Delthin/moon_repomix.index > "$EVIDENCE/registry-before.index"
          COUNT=$(jq -s --arg v "$RELEASE_VERSION" '[.[] | select(.version == $v)] | length' "$EVIDENCE/registry-before.index")
          test "$COUNT" -le 1
          if test "$COUNT" = 1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'Version already exists; no upload will be attempted.'
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            test "$RELEASE_MODE" = publish-and-verify
          fi
      - name: Install temporary publishing credential
        if: steps.before.outputs.exists == 'false' && inputs.mode == 'publish-and-verify'
        shell: bash
        env:
          MOONCAKES_CREDENTIALS_JSON: ${{ secrets.MOONCAKES_PUBLISH_CREDENTIALS_051 }}
        run: |
          test -n "$MOONCAKES_CREDENTIALS_JSON"
          test ! -e "$MOON_HOME/credentials.json"
          umask 077
          printf '%s' "$MOONCAKES_CREDENTIALS_JSON" > "$MOON_HOME/credentials.json"
          touch "$RUNNER_TEMP/mooncakes-credential-created"
          jq -e 'keys == ["token", "username"] and (.token | type == "string" and length > 0 and (contains("\n") | not) and (contains("\r") | not))' "$MOON_HOME/credentials.json" > /dev/null
          TOKEN=$(jq -er .token "$MOON_HOME/credentials.json")
          MASKED_TOKEN=${TOKEN//'%'/'%25'}
          printf '::add-mask::%s\n' "$MASKED_TOKEN"
          unset TOKEN MASKED_TOKEN
      - name: Publish at most once and preserve numeric status
        if: steps.before.outputs.exists == 'false' && inputs.mode == 'publish-and-verify'
        shell: bash
        run: |
          set +e
          moon publish > "$RUNNER_TEMP/mooncakes-publish-private.log" 2>&1
          CODE=$?
          set -e
          printf '%s\n' "$CODE" > "$EVIDENCE/publish.exit"
          tail -n 80 "$RUNNER_TEMP/mooncakes-publish-private.log"
          grep -oE 'Server status: [0-9]{3}' "$RUNNER_TEMP/mooncakes-publish-private.log" > "$EVIDENCE/publish-http-status.txt" || true
          # A lost response is not retried. The next step verifies authoritative state.
      - name: Remove runner publishing credential
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/mooncakes-credential-created"; then
            rm -f "$MOON_HOME/credentials.json" "$RUNNER_TEMP/mooncakes-credential-created"
          fi
          rm -f "$RUNNER_TEMP/mooncakes-publish-private.log"
      - name: Refresh and verify the authoritative published version
        shell: bash
        run: |
          CONFIRMED=false
          for ATTEMPT in 1 2 3 4; do
            moon update
            git -C "$MOON_HOME/registry/index" show HEAD:user/Delthin/moon_repomix.index > "$EVIDENCE/registry-after.index"
            if jq -s -e --arg v "$RELEASE_VERSION" '[.[] | select(.version == $v and .yanked == false)] | if length == 1 then .[0] else false end' "$EVIDENCE/registry-after.index" > "$EVIDENCE/registry-release.json"; then
              CONFIRMED=true
              break
            fi
            if test "$ATTEMPT" -lt 4; then sleep 10; fi
          done
          test "$CONFIRMED" = true
          SHA=$(jq -er '.checksum | select(test("^[0-9a-f]{64}$"))' "$EVIDENCE/registry-release.json")
          printf 'REGISTRY_SHA=%s\n' "$SHA" >> "$GITHUB_ENV"
      - name: Resolve independent registry-only consumer
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/registry-consumer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          CONSUMER="$RUNNER_TEMP/registry-consumer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp scripts/release-sdk-smoke.mbtx "$CONSUMER/consumer.mbtx"
          printf 'CONSUMER=%s\n' "$CONSUMER" >> "$GITHUB_ENV"
          cd "$CONSUMER"
          test ! -e moon.work
          moon run --target native --dry-run --target-dir "$RUNNER_TEMP/registry-sdk-build-$GITHUB_RUN_ID" consumer.mbtx -- "$EVIDENCE/sdk" > "$EVIDENCE/resolve.log" 2>&1
          test -f "$MOON_HOME/registry/cache/Delthin/moon_repomix/$RELEASE_VERSION.zip"
      - name: Verify canonical registry source against this checkout
        shell: bash
        run: |
          CACHE="$MOON_HOME/registry/cache/Delthin/moon_repomix/$RELEASE_VERSION.zip"
          moon run --target native scripts/release-source-verify.mbtx -- "$CACHE" "$EVIDENCE/expected-source.zip" "$REGISTRY_SHA" "$EVIDENCE/source-comparison.json"
          cp "$CACHE" "$EVIDENCE/Delthin-moon_repomix-$RELEASE_VERSION.zip"
      - name: Run the real published SDK with its own bundled resources
        shell: bash
        run: |
          mkdir -p "$EVIDENCE/sdk/resources/assets"
          CACHE="$MOON_HOME/registry/cache/Delthin/moon_repomix/$RELEASE_VERSION.zip"
          unzip -p "$CACHE" assets/tokenizer-o200k_base.tiktoken > "$EVIDENCE/sdk/resources/assets/tokenizer-o200k_base.tiktoken"
          unzip -p "$CACHE" assets/tokenizer-unicode-16.0.0.txt > "$EVIDENCE/sdk/resources/assets/tokenizer-unicode-16.0.0.txt"
          cd "$CONSUMER"
          moon run --target native --target-dir "$RUNNER_TEMP/registry-sdk-build-$GITHUB_RUN_ID" consumer.mbtx -- "$EVIDENCE/sdk" > "$EVIDENCE/sdk-run.log" 2>&1
          printf 'Registry-only v%s consumer passed from %s\n' "$RELEASE_VERSION" "$GITHUB_SHA" > "$EVIDENCE/verification.txt"
      - name: Preserve only public source and verification evidence
        if: always() && env.EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mooncakes-release-0.5.1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: warn
          retention-days: 14
