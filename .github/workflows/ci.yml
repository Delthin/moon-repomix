name: native
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    env:
      # Keep this equal to moon-toolchain; check-toolchain verifies the installation.
      MOONBIT_INSTALL_VERSION: "0.10.15+943464bfa"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned MoonBit toolchain (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install pinned MoonBit toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: moon version --all
      - run: moon update
      - name: Require the verified compiler version
        run: moon run --target native scripts/check-toolchain.mbtx
      - run: moon check --target native --deny-warn
      - run: moon test --target native
      - run: moon build --target native --release
      - name: CLI functional tests
        if: runner.os != 'Linux'
        run: moon run --target native scripts/functional.mbtx _build/native/release/build/cmd/moon-repomix/moon-repomix.exe assets/tokenizer-o200k_base.tiktoken
      - name: Independent XML and JSON parsers
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y libxml2-utils jq
      - if: runner.os == 'Linux'
        run: moon run --target native scripts/functional.mbtx _build/native/release/build/cmd/moon-repomix/moon-repomix.exe assets/tokenizer-o200k_base.tiktoken --xml-oracle
      - name: Common input and configuration scenarios
        run: moon run --target native scripts/scenarios.mbtx _build/native/release/build/cmd/moon-repomix/moon-repomix.exe assets/tokenizer-o200k_base.tiktoken
      - name: Token report functional tests
        run: moon run --target native scripts/token-reports-test.mbtx _build/native/release/build/cmd/moon-repomix/moon-repomix.exe assets/tokenizer-o200k_base.tiktoken
      - name: Output format functional tests
        if: runner.os != 'Linux'
        run: moon run --target native scripts/output-formats-test.mbtx _build/native/release/build/cmd/moon-repomix/moon-repomix.exe assets/tokenizer-o200k_base.tiktoken
      - name: Output formats with independent JSON readback
        if: runner.os == 'Linux'
        run: moon run --target native scripts/output-formats-test.mbtx _build/native/release/build/cmd/moon-repomix/moon-repomix.exe assets/tokenizer-o200k_base.tiktoken --json-oracle
      - name: Advanced repository context functional test
        run: moon run --target native scripts/advanced-context-test.mbtx _build/native/release/build/cmd/moon-repomix/moon-repomix.exe assets/tokenizer-o200k_base.tiktoken ${{ runner.os == 'Linux' && '--xml-oracle' || '' }}
      - name: Reproducible demo
        run: moon run --target native scripts/demo.mbtx
      - name: Real repository self-pack
        if: runner.os != 'Linux'
        run: moon run --target native scripts/self-pack-test.mbtx dist/self-pack
      - name: Real repository self-pack with XML readback
        if: runner.os == 'Linux'
        run: moon run --target native scripts/self-pack-test.mbtx dist/self-pack --xml-oracle
      - name: Source archive demo
        if: runner.os == 'Linux'
        run: moon run --target native scripts/source-package-test.mbtx
      - name: Install and extracted-archive smoke
        run: moon run --target native scripts/distribution-test.mbtx ${{ matrix.platform }}
      - name: Package native distribution
        run: moon run --target native scripts/package.mbtx dist ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moon-repomix-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: moon-repomix-source
          path: _build/publish/*.zip
          if-no-files-found: error
