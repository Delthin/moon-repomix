name: native
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    env:
      # Follow stable releases; check-toolchain enforces the minimum in moon-toolchain.
      MOONBIT_INSTALL_VERSION: "latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the Linux distribution baseline stable across runner image rollouts.
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install current stable MoonBit toolchain (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install current stable MoonBit toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: moon version --all
      - run: moon update
      - name: Record public package registry metadata
        if: runner.os == 'Linux'
        shell: bash
        run: git -C "$HOME/.moon/registry/index" show HEAD:user/Delthin/moon_repomix.index
      - name: Require the minimum supported compiler
        run: moon run --target native scripts/check-toolchain.mbtx
      - run: moon test --target native scripts/check-toolchain.mbtx
      - run: moon check --target native --deny-warn
      - run: moon test --target native
      - run: moon build --target native --release
      - name: CLI functional tests
        if: runner.os != 'Linux'
        run: moon run --target native scripts/functional.mbtx _build/native/release/build/cmd/moon-repomix/moon-repomix.exe assets/tokenizer-o200k_base.tiktoken
      - name: Independent XML and JSON parsers
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y libxml2-utils jq
      - if: runner.os == 'Linux'
        run: moon run --target native scripts/functional.mbtx _build/native/release/build/cmd/moon-repomix/moon-repomix.exe assets/tokenizer-o200k_base.tiktoken --xml-oracle
      - name: Common input and configuration scenarios
        run: moon run --target native scripts/scenarios.mbtx _build/native/release/build/cmd/moon-repomix/moon-repomix.exe assets/tokenizer-o200k_base.tiktoken
      - name: Literal file-list and stdout compatibility
        run: moon run --target native scripts/input-list-test.mbtx
      - name: Token report functional tests
        if: runner.os == 'Linux'
        run: moon run --target native scripts/token-reports-test.mbtx _build/native/release/build/cmd/moon-repomix/moon-repomix.exe assets/tokenizer-o200k_base.tiktoken
      - name: Output formats with independent JSON readback
        if: runner.os == 'Linux'
        run: moon run --target native scripts/output-formats-test.mbtx _build/native/release/build/cmd/moon-repomix/moon-repomix.exe assets/tokenizer-o200k_base.tiktoken --json-oracle
      - name: Advanced repository context functional test
        run: moon run --target native scripts/advanced-context-test.mbtx _build/native/release/build/cmd/moon-repomix/moon-repomix.exe assets/tokenizer-o200k_base.tiktoken ${{ runner.os == 'Linux' && '--xml-oracle' || '' }}
      - name: Mixed full/skeleton context and template functional test
        run: >-
          moon run --target native scripts/context-customization-test.mbtx
          _build/native/release/build/cmd/moon-repomix/moon-repomix.exe
          assets/tokenizer-o200k_base.tiktoken
          --text-error-category ContextTextError
          --security-error-category ContextSecurityError
          --log-dir "${{ runner.temp }}/context-customization"
          ${{ runner.os == 'Linux' && '--xml-oracle' || '' }}
      - name: Display chapter, line and path functional test
        if: runner.os == 'Linux'
        run: >-
          moon run --target native scripts/display-controls-test.mbtx
          _build/native/release/build/cmd/moon-repomix/moon-repomix.exe
          assets/tokenizer-o200k_base.tiktoken
          ${{ runner.os == 'Linux' && '--xml-oracle' || '' }}
      - name: Exact volumes, input limits and machine reports
        run: >-
          moon run --target native scripts/volume-cli-test.mbtx
          _build/native/release/build/cmd/moon-repomix/moon-repomix.exe
          assets/tokenizer-o200k_base.tiktoken
          --log-dir "${{ runner.temp }}/volume-cli"
          ${{ runner.os == 'Linux' && '--xml-oracle' || '' }}
      - name: Native WebUI HTTP functional test
        # Windows honors these; the HTTP test client uses /tmp on Unix.
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: >-
          moon run --target native scripts/webui-test.mbtx --
          "${{ github.workspace }}/_build/native/release/build/cmd/moon-repomix/moon-repomix.exe"
          "${{ github.workspace }}/assets/tokenizer-o200k_base.tiktoken"
      - name: Portable CLI requests and bounded JSONL sessions
        run: >-
          moon run --target native scripts/context-entry-test.mbtx -- --ready
          "${{ github.workspace }}/_build/native/release/build/cmd/moon-repomix/moon-repomix.exe"
          "${{ github.workspace }}/assets/tokenizer-o200k_base.tiktoken"
          "${{ runner.temp }}/context-entry"
      - name: Prepare shared native-entry parity fixture
        run: >-
          moon run --target native scripts/context-parity-test.mbtx -- --prepare-only
          "${{ runner.temp }}/context-parity"
          "${{ github.workspace }}/scripts/context-parity-sdk.mbt"
      - name: SDK, CLI, MCP and HTTP context parity
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          moon run --target native scripts/context-parity-test.mbtx -- --ready \
            "$GITHUB_WORKSPACE/_build/native/release/build/cmd/moon-repomix/moon-repomix.exe" \
            "$GITHUB_WORKSPACE/assets/tokenizer-o200k_base.tiktoken" \
            "$GITHUB_WORKSPACE" "$SOURCE_SHA" "${{ runner.temp }}/context-parity"
      - name: Prepare fixed MCP stdio fixture
        run: >-
          moon run --target native scripts/mcp-test.mbtx --
          --prepare-only "${{ runner.temp }}/mcp-stdio"
      - name: MCP modern and legacy real pipe sessions
        run: >-
          moon run --target native scripts/mcp-test.mbtx -- --ready
          "${{ github.workspace }}/_build/native/release/build/cmd/moon-repomix/moon-repomix.exe"
          "${{ github.workspace }}/assets/tokenizer-o200k_base.tiktoken"
          "${{ github.workspace }}" "${{ runner.temp }}/mcp-stdio"
      - name: Prepare task and code context fixture
        run: >-
          moon run --target native scripts/task-context-mcp-test.mbtx --
          --prepare-only "${{ runner.temp }}/task-code-context"
      - name: Task budgets and cumulative code reads over MCP
        run: >-
          moon run --target native scripts/task-context-mcp-test.mbtx -- --ready
          "${{ github.workspace }}/_build/native/release/build/cmd/moon-repomix/moon-repomix.exe"
          "${{ github.workspace }}/assets/tokenizer-o200k_base.tiktoken"
          "${{ runner.temp }}/task-code-context"
      - name: Selection explanations and combined context workflow
        run: >-
          moon run --target native scripts/context-workflow-test.mbtx --
          "${{ github.workspace }}/_build/native/release/build/cmd/moon-repomix/moon-repomix.exe"
          "${{ github.workspace }}/assets/tokenizer-o200k_base.tiktoken"
          "${{ runner.temp }}/context-workflow"
      - name: Real MoonBit sources and compression ranges
        if: runner.os == 'Linux'
        run: moon run --target native scripts/self-pack-test.mbtx "${{ runner.temp }}/self-pack"
      - name: Source archive demo
        if: runner.os == 'Linux'
        run: moon run --target native scripts/source-package-test.mbtx
      - name: Install and verify the distribution to upload
        run: moon run --target native scripts/distribution-test.mbtx ${{ matrix.platform }} dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moon-repomix-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: moon-repomix-source
          path: _build/publish/*.zip
          if-no-files-found: error
      - name: MoonBit self-pack evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Linux'
        with:
          name: moonbit-self-pack-${{ matrix.platform }}
          path: ${{ runner.temp }}/self-pack/moonbit-*
          if-no-files-found: ignore
      - name: Context customization diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: context-customization-${{ matrix.platform }}
          path: ${{ runner.temp }}/context-customization
          if-no-files-found: ignore
      - name: Volume CLI diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: volume-cli-${{ matrix.platform }}
          path: ${{ runner.temp }}/volume-cli
          if-no-files-found: ignore
      - name: WebUI HTTP request and response diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: webui-http-${{ matrix.platform }}
          path: |
            ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/moon-webui-http-*/*.json
            ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/moon-webui-http-*/*.txt
            ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/moon-webui-http-*/http/**
            ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/moon-webui-http-*/quota-http/**
          if-no-files-found: ignore
      - name: Portable CLI request diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: context-entry-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/context-entry
            !${{ runner.temp }}/context-entry/fixture/**
          if-no-files-found: ignore
      - name: Native-entry parity diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: context-parity-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/context-parity/prepared.json
            ${{ runner.temp }}/context-parity/request-*.json
            ${{ runner.temp }}/context-parity/run-*/*.json
            ${{ runner.temp }}/context-parity/run-*/*.jsonl
            ${{ runner.temp }}/context-parity/run-*/*.txt
            ${{ runner.temp }}/context-parity/run-*/moon.work
          if-no-files-found: ignore
      - name: MCP stdio diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mcp-stdio-${{ matrix.platform }}
          path: ${{ runner.temp }}/mcp-stdio
          if-no-files-found: ignore
      - name: Task and code context diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: task-code-context-${{ matrix.platform }}
          path: ${{ runner.temp }}/task-code-context
          if-no-files-found: ignore
      - name: Combined context workflow diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: context-workflow-${{ matrix.platform }}
          # The JSON manifest preserves all fixture paths and text. Raw POSIX
          # LF filenames cannot be uploaded as cross-platform artifact entries.
          path: |
            ${{ runner.temp }}/context-workflow
            !${{ runner.temp }}/context-workflow/fixture/**
          if-no-files-found: ignore
